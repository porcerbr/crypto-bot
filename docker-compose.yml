version: '3.8'

services:
  trading-bot:
    build: .
    container_name: trading_bot_pro
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./data_storage:/app/data_storage
      - ./logs:/app/logs
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
